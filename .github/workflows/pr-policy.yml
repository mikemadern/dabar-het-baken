name: PR policy

# Afspraken voor pull requests, zie CONTRIBUTING.md:
#   - linked-issue: elke PR hoort in principe bij een issue (Closes #nummer)
#   - no-coauthor:  geen "Co-authored-by"-regels in commits

on:
  pull_request:
    branches: [develop]
    # edited/labeled/unlabeled: de check moet opnieuw draaien zodra je de
    # beschrijving aanpast of het label "geen-issue" zet.
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    name: linked-issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the PR is linked to an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot-PR's hebben geen issue nodig."
            exit 0
          fi

          if gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx "geen-issue"; then
            echo "Label 'geen-issue' staat op de PR: bewust zonder issue."
            exit 0
          fi

          # closingIssuesReferences volgt zowel "Closes #n" in de beschrijving als een
          # koppeling via de zijbalk; na het aanpassen van de beschrijving kan het even
          # duren voordat GitHub dit bijwerkt, vandaar een paar pogingen.
          issues=""
          for attempt in 1 2 3; do
            issues=$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
            [ -n "$issues" ] && break
            sleep 5
          done

          if [ -n "$issues" ]; then
            echo "Gekoppeld aan issue(s): $(echo "$issues" | sed 's/^/#/' | tr '\n' ' ')"
            exit 0
          fi

          echo "::error title=Geen issue gekoppeld::Zet 'Closes #<nummer>' in de beschrijving van de PR. Kleine klus zonder issue? Zet dan het label 'geen-issue' op de PR."
          {
            echo "### Geen issue gekoppeld"
            echo
            echo "Elke PR hoort in principe bij een issue."
            echo
            echo "- Zet **\`Closes #<nummer>\`** in de beschrijving van de PR, of"
            echo "- zet het label **\`geen-issue\`** op de PR als het bewust een kleine klus zonder issue is."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  no-coauthor:
    name: no-coauthor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject Co-authored-by trailers in the commits of this PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          offenders=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | select(.commit.message | split("\n") | any(.[]; test("^\\s*co-authored-by:"; "i"))) | "\(.sha[0:7]) \(.commit.message | split("\n")[0])"')

          if [ -n "$offenders" ]; then
            echo "::error title=Co-authored-by gevonden::Commits mogen geen Co-authored-by-regel bevatten. Zie de lijst in de log."
            echo "Commits met een Co-authored-by-regel:"
            echo "$offenders"
            {
              echo "### Co-authored-by gevonden"
              echo
              echo "Commits in deze PR mogen geen \`Co-authored-by\`-regel bevatten:"
              echo
              echo "$offenders" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Geen Co-authored-by-regels in de commits van deze PR."
